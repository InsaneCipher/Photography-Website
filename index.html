	<script>
		document.addEventListener("DOMContentLoaded", function () {
			// Get the "Menu" <li> element
			let menuButton = document.querySelector("#topNavMobile li");

			// Get the mobileNav div
			let mobileNav = document.getElementById("mobileNav");

			// ✅ Ensure the menu starts hidden
			mobileNav.style.display = "none";

			// Add click event to toggle visibility
			menuButton.addEventListener("click", function () {
				if (mobileNav.style.display === "none") {
					mobileNav.style.display = "block"; // Show menu
				} else {
					mobileNav.style.display = "none"; // Hide menu
				}
			});
		});
	</script>
	
	<script>
		window.addEventListener("resize", function () {
			let mobileNav = document.getElementById("mobileNav");
			if (window.innerWidth > 1400) {
				mobileNav.style.display = "none";
			}
		});
	</script>

    <script src="gallery.js"></script>
    <script>
        function setActiveLink(view, year) {
            document.querySelectorAll("#mainNavigation a, #mobileNav a").forEach(a => a.classList.remove("active"));

            let selector = null;
            if (view === "gear") {
                selector = 'a[href="index.html?view=gear"]';
            } else if (year) {
                selector = `a[href="index.html?view=portfolio&year=${year}"]`;
            } else {
                selector = 'a[href="index.html?view=portfolio"]';
            }

            if (selector) document.querySelectorAll(selector).forEach(a => a.classList.add("active"));
        }

        function showView(view) {
                const portfolio = document.getElementById("portfolioView");
                const gear = document.getElementById("gearView");

                portfolio.style.display = (view === "gear") ? "none" : "block";
                gear.style.display = (view === "gear") ? "block" : "none";
            }

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const view = params.get("view") || "portfolio";
            const year = params.get("year"); // "2024" / "2025" / null

            showView(view);
            setActiveLink(view, year);

            if (view !== "gear") {
                // Render portfolio (all years if year is null)
                await renderGallery({ yearFilter: year });
            } else {
                // Optional: change title when on gear
                document.title = "My Gear";
            }
        });
    </script>
